let currentIdx = new Date().getMonth(); // ప్రస్తుత నెల ఇండెక్స్

function displayMonth(index) {
if (index < 0) index = 11;
if (index > 11) index = 0;
currentIdx = index;

const data = monthsData[currentIdx];

// టైటిల్ మరియు బ్యాడ్జ్ అప్డేట్
document.getElementById("monthTitle").innerHTML = `📅 ${data.name} నెలవారీ పనులు`;

let htmlContent = `<span class="badge">${data.season}</span><ul>`;
data.tasks.forEach(task => {
htmlContent += `<li>${task}</li>`;
});
htmlContent += `</ul>`;

document.getElementById("monthContent").innerHTML = htmlContent;
}

function changeMonth(direction) {
displayMonth(currentIdx + direction);
}

// పేజ్ లోడ్ అయినప్పుడు ప్రస్తుత నెల వివరాలు సెట్ చేయడం

const currentMonthIndex = new Date().getMonth();

document.getElementById("currentMonth").innerHTML = monthsList[currentMonthIndex];

let season = "";
if(currentMonthIndex >= 5 && currentMonthIndex <= 9){
season = "🌧️ ఖరీఫ్";
} else if(currentMonthIndex >= 10 || currentMonthIndex <= 1){
season = "❄️ రబీ";
} else {
season = "☀️ వేసవి";
}

document.getElementById("currentSeason").innerHTML = season;
document.getElementById("currentCrop").innerHTML = "పత్తి • వరి • మొక్కజొన్న";
