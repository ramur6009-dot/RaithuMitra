function loadProblems(){
const crop = document.getElementById("crop").value;
const problem = document.getElementById("problem");
problem.innerHTML="";
if(!crop){
problem.innerHTML="<option>ముందుగా పంటను ఎంచుకోండి</option>";
return;
}
if(cropDatabase[crop] && cropDatabase[crop].problems){
cropDatabase[crop].problems.forEach(function(item){
problem.innerHTML += `<option value="${item}">${item}</option>`;
});
}
}

function checkProblem(){
const crop = document.getElementById("crop").value;
const problem = document.getElementById("problem").value;

if(crop=="" || problem==""){
alert("ముందుగా పంట మరియు సమస్యను ఎంచుకోండి.");
return;
}

if(!cropData[crop] || !cropData[crop][problem]){
alert("ఈ సమస్యకు సమాచారం ఇంకా జోడించలేదు.");
return;
}

const info = cropData[crop][problem];

document.getElementById("diseaseImage").src = info.image;
document.getElementById("disease").innerHTML = problem;
document.getElementById("symptoms").innerHTML = info.symptoms;
document.getElementById("reason").innerHTML = info.reason;
document.getElementById("medicine").innerHTML = info.medicine;
document.getElementById("dose").innerHTML = info.dose;
document.getElementById("water").innerHTML = info.water;
document.getElementById("time").innerHTML = info.time;
document.getElementById("warning").innerHTML = info.warning;
document.getElementById("prevention").innerHTML = info.prevention;
document.getElementById("level").innerHTML = info.level;

document.getElementById("result").style.display = "block";
}

function shareAdvice(){
let disease = document.getElementById("disease").innerText;
let medicine = document.getElementById("medicine").innerText;
let dose = document.getElementById("dose").innerText;
let prevention = document.getElementById("prevention").innerText;

let text = "🌿 రైతు మిత్ర - పంట వైద్యుడు\n\n🦠 సమస్య : "+disease+"\n\n💊 మందు : "+medicine+"\n\n📏 మోతాదు : "+dose+"\n\n🌱 నివారణ : "+prevention;

if(navigator.share){
navigator.share({
title:"రైతు మిత్ర",
text:text
});
} else {
navigator.clipboard.writeText(text);
alert("సలహా కాపీ చేయబడింది");
}
}

function printAdvice(){
window.print();
}

function saveFavourite(){
let crop = document.getElementById("crop").value;
let problem = document.getElementById("problem").value;
localStorage.setItem("favCrop", crop);
localStorage.setItem("favProblem", problem);
alert("⭐ Favourite గా సేవ్ చేయబడింది");
}

window.onload = function(){
let crop = localStorage.getItem("favCrop");
let problem = localStorage.getItem("favProblem");
if(crop){
document.getElementById("crop").value = crop;
loadProblems();
setTimeout(function(){
document.getElementById("problem").value = problem;
},200);
}
};

const resultEl = document.getElementById("result");
resultEl.insertAdjacentHTML("beforeend", `
<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:20px;">
<button onclick="saveFavourite()" style="background:#ff9800;">⭐ Favourite</button>
<button onclick="shareAdvice()" style="background:#2196F3;">📤 Share</button>
<button onclick="printAdvice()" style="background:#4CAF50;">🖨️ Print</button>
<button onclick="copyMedicine()" style="background:#9C27B0;">📋 Copy</button>
</div>
`);
