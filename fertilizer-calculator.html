<label>1 కిలో ధర (రూ.)</label>
<input type="number" id="price" placeholder="ఉదా : 30">

<button onclick="calculatePrice()">
💵 మొత్తం ఖర్చు లెక్కించండి
</button>

<div class="result" id="priceResult" style="display:none; margin-top:15px;">
<h2>💰 మొత్తం ఖర్చు</h2>
<p>₹ <span class="price" id="totalPrice">0</span></p>
</div>

</div>
</div>

</div>

<script>
function calculate(){
let crop=document.getElementById("crop").value;
let fertilizer=document.getElementById("fertilizer").value;
let acre=parseFloat(document.getElementById("acre").value);

if(crop=="" || fertilizer=="" || isNaN(acre)){
alert("అన్ని వివరాలు నమోదు చేయండి");
return;
}

let dose=0;
switch(fertilizer){
case "యూరియా": dose=50; break;
case "అమ్మోనియం సల్ఫేట్": dose=50; break;
case "అమ్మోనియం క్లోరైడ్": dose=40; break;
case "కాల్షియం అమోనియం నైట్రేట్": dose=50; break;
case "SSP": dose=100; break;
case "TSP": dose=50; break;
case "రాక్ ఫాస్ఫేట్": dose=100; break;
case "MOP": dose=25; break;
case "SOP": dose=25; break;
case "DAP": dose=100; break;
case "20:20:0:13": dose=50; break;
case "10:26:26": dose=50; break;
case "12:32:16": dose=50; break;
case "15:15:15": dose=50; break;
case "14:35:14": dose=40; break;
case "28:28:0": dose=50; break;
case "19:19:19": dose=10; break;
case "13:0:45": dose=10; break;
case "00:52:34": dose=5; break;
case "0:32:48": dose=5; break;
case "0:0:50": dose=10; break;
